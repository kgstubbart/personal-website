<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Kason Stubbart</title>
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Rewrites the 404 GitHub Pages serves for unknown paths (e.g. /projects)
      // into a query string that index.html decodes back into the real route.
      var pathSegmentsToKeep = 0; // served from the domain root (kgstubbart.dev)
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
            .split("/")
            .slice(0, 1 + pathSegmentsToKeep)
            .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash,
      );
    </script>
  </head>
  <body></body>
</html>
