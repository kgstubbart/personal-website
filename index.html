    <script>
      // Restores the real path after the GitHub Pages 404.html SPA redirect.
      // See public/404.html and https://github.com/rafgraph/spa-github-pages
      (function () {
        var search = window.location.search;
        if (search[1] === "/") {
          var decoded = search
            .slice(1)
            .split("&")
            .map(function (segment) {
              return segment.replace(/~and~/g, "&");
            })
            .join("?");
          window.history.replaceState(
            null,
            "",
            window.location.pathname.slice(0, -1) + decoded + window.location.hash,
          );
        }
      })();
    </script>

    <script>
      (function () {
        try {
          var stored = localStorage.getItem("kgstubbart-theme");
          var theme =
            stored === "light" || stored === "dark"
              ? stored
              : window.matchMedia("(prefers-color-scheme: light)").matches
                ? "light"
                : "dark";
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          document.documentElement.setAttribute("data-theme", "dark");
        }
      })();
    </script>
